<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Historieta original de Peregrino</title>
  <style>
    html,body{height:100%;margin:0;background:#fffaf0;font-family:system-ui,sans-serif}
    .wrap{min-height:100%;display:grid;place-items:center;padding:24px;text-align:center;box-sizing:border-box}
    a{color:#173f7a;font-weight:800}
  </style>
  <script>
    (function() {
      const savedLang = localStorage.getItem("gTranslateLang");
      
      if (savedLang && savedLang !== "es") {
        window.addEventListener("load", function() {
          setTimeout(function() {
            const selectElement = document.querySelector(".goog-te-combo");
            if (selectElement) {
              selectElement.value = savedLang;
              selectElement.dispatchEvent(new Event("change"));
            }
          }, 300);
        });
      }
      
      const observer = new MutationObserver(function() {
        const selectElement = document.querySelector(".goog-te-combo");
        if (selectElement) {
          selectElement.removeEventListener("change", handleLanguageChange);
          selectElement.addEventListener("change", handleLanguageChange);
        }
      });
      
      function handleLanguageChange(e) {
        const selectedLang = e.target.value;
        localStorage.setItem("gTranslateLang", selectedLang);
      }
      
      observer.observe(document.body, {
        childList: true,
        subtree: true
      });
    })();
  </script>

</head>
<body>
  <div class="wrap">
    <p>
      En la publicación final, este archivo se sustituye automáticamente por la
      historieta original del sitio.<br><br>
      <a href="https://madeprat.github.io/peregrino-app-web/historieta.html">Abrir temporalmente la historieta publicada</a>
    </p>
  </div>
</body>
</html>
